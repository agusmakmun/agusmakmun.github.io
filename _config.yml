title: Stack Solutions
description: Notes and fixes from building and running production systems
author: Agus Makmun
github: https://github.com/agusmakmun
repo: agusmakmun/agusmakmun.github.io # star count in the header
about: 'SDE Lead working across the whole stack: backend, frontend, databases and the infrastructure that ships them. These days mostly infrastructure and Next.js, like moving apps off Vercel and Supabase to self-hosted.'
disqus_shortname: stackproblems
google_analytics: G-7EFYCH5FQ7 # GA4 measurement ID; analytics is skipped while empty

# Redesign profile (sidebar on the home page)
tagline: SDE Lead · CDP · CASP
status: Open to consulting
profile_stats:
  - label: Focus
    value: Infra & Next.js
  - label: Experience
    value: 10+ yrs · since 2015
stack: [Next.js, PostgreSQL, Docker, Self-hosting, AWS, Redis, Python, Django, Channels]

# brand = logo in _includes/brand-icon.html (github, linkedin, stackoverflow); icon = Material Symbols name
social_links:
  - brand: github
    title: GitHub
    link: 'https://github.com/agusmakmun'
  - brand: linkedin
    title: LinkedIn
    link: 'https://linkedin.com/in/agusmakmun'
  - brand: stackoverflow
    title: Stack Overflow
    link: 'https://stackoverflow.com/users/6396981'
  - icon: rss_feed
    title: Feed
    link: '/feed.xml'

nav:
  - text: Home
    url: /
  - text: Writing
    url: /writing/
  - text: Projects
    url: /projects/
  - text: About
    url: /about/

url: 'https://agusmakmun.github.io'
baseurl: ''
paginate: 20
paginate_path: '/page/:num/'
markdown: kramdown
plugins:
  - jekyll-paginate
  - jekyll-gist
  - jekyll-seo-tag

# SEO (jekyll-seo-tag): canonical, Open Graph, Twitter and JSON-LD
lang: en
logo: /static/img/og-default.png
twitter:
  card: summary_large_image
social: # Person profiles for JSON-LD (sidebar links live in social_links)
  name: Agus Makmun
  links:
    - https://github.com/agusmakmun
    - https://linkedin.com/in/agusmakmun
    - https://stackoverflow.com/users/6396981

exclude: [docker-compose.yml, README.md, LICENSE, vendor, .bundle, .playwright-mcp]

compress_html:
  clippings: all
  comments: ['<!-- ', ' -->']
  endings: all
  ignore:
    envs: ['development']

# Default share image for every page; a post's own `image:` overrides it.
defaults:
  - scope:
      path: ''
    values:
      image: /static/img/og-default.png
