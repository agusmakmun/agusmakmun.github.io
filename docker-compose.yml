# Local preview: `docker compose up` then open http://localhost:4000
# (system Ruby on macOS is too old for Jekyll 4)
services:
  jekyll:
    image: ruby:3.3
    working_dir: /srv/jekyll
    command: sh -c "gem install bundler:2.5.22 --conservative && bundle install && bundle exec jekyll serve --host 0.0.0.0 --livereload --force_polling"
    environment:
      BUNDLE_PATH: /usr/local/bundle
    volumes:
      - .:/srv/jekyll
      - bundle:/usr/local/bundle
    ports:
      - '4000:4000'
      - '35729:35729'

volumes:
  bundle:
